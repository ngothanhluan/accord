closure_verdicts:
  - prior: "1. blocker / threat_model / 06-01 T-06-03"
    verdict: closed
    note: >-
      The behavioural route was taken and it decides the guard on both legs. `dest` is one of
      `skillTargets()`'s file paths; the link is placed AT that path (junction form on Windows,
      plain symlink on POSIX), which is exactly the path bullet 7 lstats. With the guard: not a
      regular file -> UsageError -> exit 2, stderr names the posix path, decoy untouched. With
      bullet 7 dropped: on POSIX `writeFileSync` follows the symlink and the decoy's `latin1`
      bytes change; on Windows `writeFileSync` onto a reparse-point directory throws outside the
      UsageError catch, so the exit code is not 2. The case goes red either way. The `must_haves`
      truth no longer carries `verification: backstop`, acceptance criterion 11 names the red
      condition explicitly ("Removing the `lstatSync` refusal ... makes this case fail"), and the
      T-06-03 Mitigation Plan cell was rewritten to say the guard is not a backstop. See the first
      `info` entry below for the one residual scope point.
  - prior: "2. warning / key_links_planned / 06-01"
    verdict: closed
    note: >-
