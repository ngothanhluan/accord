issues:
  - dimension: verification_derivation
    plans: ["06-02", "06-04"]
    task: "06-02 Task 1 step 1 / 06-04 Task 3 step 2"
    severity: blocker
    required_property: >-
      No text any plan in this phase instructs the executor to render matches a forbidden
      criterion-6 shape - including text a plan graduates verbatim rather than authors.
    evidence: >-
      06-02 Task 1 step 1 says "Move the bodies of docs/skills/debug.md and
      docs/skills/code-review.md unchanged", and its acceptance criterion (06-02 line 234) pins
      the result: "their bodies match the former docs/skills/ bodies modulo the frontmatter
      block". docs/skills/debug.md line 24 in the working tree today reads: "Debugging state lives
      in ## Plan in the ticket. There is no session file and no resume command: accord status plus
      the ticket is the whole picture." That body renders to accord-dev/debug.md, which is inside
      skillTargets() and therefore inside the scan 06-04 Task 3 runs over the WHOLE render output.
      "session file" is shape 2 exactly - the noun, one space, the artifact word file - so the
      offender array is non-empty and toEqual([]) fails. This is not a near miss like the four
      occurrences checked above; the string is checked in, the plan says move it unchanged, and
      the narrowing does not and should not exclude it. 06-04 Task 1 step 5 already diagnoses this
      exact shape for the BA file - "a sentence introducing those phrasings to deny them is the
      one thing that makes a true criterion read as false" - but the instruction was applied only
      to ba/SKILL.md, not to the graduated technique body, which is the older instance of the same
      sentence and the one prior finding 4's evidence quoted. code-review.md and every other
      specified text are clean; grep over docs/skills/, packages/core/skills/ and
      packages/core/templates/ returns this file and nothing else.
    failure_scenario: >-
      Wave 2 lands packages/core/skills/dev/debug.md with the sentence intact, exactly as its
      acceptance criterion requires. Wave 3's executor writes the criterion-6 negative as
      specified, runs it, and gets one offender at accord-dev/debug.md:24. The two available
      repairs are both plan violations: edit the graduated body, which breaks 06-02's "unchanged"
      criterion that a wave-2 verifier has already signed off; or widen the scan's exclusion until
      "session file" is no longer a match, which is the finding this whole chain descends from and
      leaves ROADMAP criterion 6 ("no session or handoff file exists anywhere") unverified while
      appearing green. Criterion 6 of the phase goal is decided by this one assertion.
    fix_hint: >-
      One non-binding route: 06-02 Task 1 step 1 states that the one sentence in debug.md denying
      a session file and a resume command is replaced by the positive statement of the same fact
      ("Debugging state lives in ## Plan in the ticket; accord status plus the ticket is the whole
      picture"), for the reason 06-04 Task 1 step 5 already gives, and 06-02's acceptance
      criterion names that one sentence as the sole permitted difference from the former body.
      Another: the graduation happens as specified and 06-04 Task 3 additionally instructs the
      strike, so the change sits in the plan that owns the criterion. Either way the plan decides
      it - the executor's alternative is to bend the scan.
