# Phase 06-skills - plan-checker findings (pre-execution)
# Verdict: ISSUES FOUND - 1 blocker, 8 warnings, 2 info
# `required_property` + `evidence` + `severity` bind. `fix_hint` is ONE non-binding example route;
# any mechanism that reaches `required_property` counts as addressing the issue.

issues:
  - dimension: threat_model
    plan: "06-01"
    task: 1
    severity: blocker
    required_property: "The high-severity T-06-03 mitigation is decided by a check that fails when the guard is absent"
    evidence: >-
      The phase threshold is block-on-`high` and T-06-03 is the one `high` in the register. Its
      mitigation - `lstatSync(file, { throwIfNoEntry: false })`, refuse a symlink/junction/directory
      with `UsageError` exit 2 before any write - exists only as the seventh bullet of Task 1's
      nine-bullet action. Task 1's 10 acceptance criteria do not mention it. Task 3's CLI cases are
      roster filtering, runtime filtering and mtime. 06-03 Task 2's six cases are `updated`,
      `overwrote local edits`, no-marker, orphan, pin mismatch, no-config. `must_haves` disposes of
      it as `verification: backstop`. That backstop classification does not hold here the way
      D-115's does: `fs.symlinkSync(target, path, 'junction')` needs no elevation on Windows, so a
      cross-platform check is cheap and available - this is not a property that resists
      verification, it is one nobody verified.
    failure_scenario: >-
      The executor drops action bullet 7 while every test and every `<verify>` stays green and the
      phase verifies. `writeFileSync` then follows a junction at `.claude/skills/accord-dev/` and
      puts accord's bytes at a path the user never named.
    fix_hint: >-
      One non-binding route: a sandbox case that places a junction at one destination and asserts
      exit 2 with the junction target's bytes untouched. A smaller route that also reaches the
      property: a Task 1 acceptance criterion that fails when the `lstat` refusal is absent from
      `packages/cli/src/commands/skills.ts`.

  - dimension: key_links_planned
    plan: "06-01"
    task: 1
    severity: warning
    required_property: "Every core function a CLI task is instructed to call is exported from the seam the plan names as the only one the CLI may reach through"
    evidence: >-
      Action step 7 instructs the CLI to "read it, apply `normaliseText` from core". Step 6
      enumerates the exports to add to `packages/core/src/index.ts` - `renderSkill`, `contentHash`,
      `markerHash`, `withoutMarker`, `skillTargets`, `SkillFile`, `skills`, `SkillKey` - and
      `normaliseText` is not among them. Read directly: `packages/core/src/index.ts` does not export
      it today, and every file under `packages/cli/src/` imports from the package root
      `@accord-dev/accord-core`. The plan's own `key_links` calls `index.ts` "the only seam the CLI
      may reach through (D-107)".
    failure_scenario: >-
      The executor hand-rolls the BOM/CRLF strip inside `skills.ts` - `PATTERNS.md:121` records
      `templates.test.ts` already doing exactly that - producing a fourth copy of the normalisation
      that RESEARCH.md Pitfall 1 is about, on the read-back side of the no-op comparison.
    fix_hint: "Add `normaliseText` to step 6's export list."

  - dimension: verification_derivation
    plans: ["06-02", "06-04"]
    task: null
    severity: warning
    required_property: "Each clause of ROADMAP criterion 4 is decided by a criterion that can fail"
    evidence: >-
      Clause 1 (BA stops before Ready "while open questions, unconfirmed assumptions, or TODO
      markers remain") is pinned only by 06-04's `contains the literal draft` and
      `names ## Open questions`; the assumptions and TODO halves appear only in Task 1's action
      prose. Clause 2 (the review step "writes only `verification.md`") is pinned by nothing:
      06-02 Task 1 and Task 3 assert the step names a fresh context, names `./review.md` and names
      no runtime product, while the write boundary sits in a `status: unverified /
      verification: flagged` prohibition. Clause 3 (only the developer writes `verified`) is
      properly pinned by "across the entire render output, exactly one file describes writing
      `verified`".
    failure_scenario: >-
      `review.md` ships telling the fresh context to fix what it finds rather than report it; CI is
      green; criterion 4's middle clause is false in the exact place the phase goal exists for.
    fix_hint: >-
      Widen the whole-render-output negatives 06-01 Task 3 already writes: one asserting no file
      outside `accord-dev/SKILL.md` instructs an edit to source, one asserting the BA text names
      all three Ready blockers.

  - dimension: verification_derivation
    plan: "06-04"
