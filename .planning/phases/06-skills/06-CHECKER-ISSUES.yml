  - dimension: pattern_compliance
    plan: "06-01"
    task: null
    severity: info
    required_property: "A deliberate deviation from the PATTERNS.md file map is recorded where the executor reads it"
    evidence: >-
      06-PATTERNS.md's File Classification maps `packages/core/src/skills/hash.ts` (analog
      `packages/core/src/gate/hash.ts`, exact) and `packages/core/src/skills/index.ts` (barrel,
