  - dimension: claude_md_compliance
    plans: ["06-01", "06-04"]
    task: null
    severity: warning
    required_property: "Every authored prose file that renders into a user repository carries a criterion that it names no other tool, plugin, harness, or planning system"
    claude_md_rule: "No other tools named - binding, and explicitly extended to the workflow and technique text that renders into shipped SKILL.md files"
    evidence: >-
      Covered by an acceptance criterion: `shared/prototype.md` (06-01 Task 2), everything under
      `packages/core/skills/dev/` (06-02 Task 1), `ba/SKILL.md` and `ba/setup.md` (06-04 Task 1).
      Not covered: `designer/SKILL.md` (06-01 Task 1), `ba/story.md` and `ba/ready.md` (06-04
      Task 2). `ready.md`'s only related criterion is "names no runtime product by name", a strictly
      narrower set than tools, plugins, harnesses and planning systems.
    failure_scenario: >-
      `ba/ready.md` names a planning system while explaining the fresh-context review shape, and it
      publishes to npm under a constraint the project states as absolute.
    fix_hint: >-
      One assertion over the whole render output rather than three more per-file criteria.

  - dimension: context_compliance
    plan: "06-02"
    task: 2
    severity: warning
    required_property: "Each ROADMAP success criterion is either satisfied by the plans or amended before verification runs"
    evidence: >-
      ROADMAP criterion 5 ends "Drafts live in `docs/skills/`". D-105 (locked) graduates them into
      `packages/core/skills/`, Task 2 `git rm`s both files, and "`git ls-files docs/skills` returns
      nothing" is an acceptance criterion. The contradiction is correctly surfaced - 06-02's
      `flagged_assumptions`, second entry, in frontmatter, with the rejected alternative and why.
      The gap is downstream: no plan touches `.planning/ROADMAP.md`.
    failure_scenario: >-
      `/gsd-verify-work` reads criterion 5's final clause, finds `docs/skills/` deleted, and fails a
      phase that did exactly what the locked decision required.
    fix_hint: >-
      Amend criterion 5's final clause to name `packages/core/skills/` as the source. The property
      must NOT be reached by keeping `docs/skills/` - that contradicts locked decision D-105 and
      reintroduces the drift the phase exists to remove.

  - dimension: scope_sanity
    plans: ["06-03", "06-04"]
    task: 1
    severity: warning
    required_property: "A Wave-3 plan's own verify passes without output produced by a plan running beside it, and added assertions are the ones the requirement asks for"
    evidence: >-
      SKILL-08 requires one direction - "a test asserts every CLI command named in a skill exists".
      06-03 Task 1 adds a third assertion in the other direction: every registered command path must
      appear in at least one rendered file, "OR is listed in a short, commented exemption array".
      `accord new ticket` and `accord status` are named only in 06-04's `ba/SKILL.md` and
      `setup.md`; `accord skills sync` is named by no skill prose at all. 06-03 and 06-04 are both
      Wave 3 and neither declares `depends_on` on the other.
    failure_scenario: >-
      06-03 lands before 06-04 in the wave; the reverse assertion fails on `new ticket` and
      `status`; the cheapest repair is to add both to the exemption array, permanently defeating the
      assertion for the two commands it would otherwise have caught. CLAUDE.md's simplicity rule is
      also in play - the escape hatch is a hand-maintained list.
    fix_hint: >-
      Drop the reverse assertion - SKILL-08 is satisfied without it. Alternatively declare
      `depends_on: ["06-04"]` on 06-03 so the render output it reads is complete when it runs,
      accepting the loss of Wave-3 parallelism.

  - dimension: scope_sanity
    plan: "06-02"
    task: null
    severity: warning
    required_property: "Each plan stays within the per-plan context budget"
    evidence: >-
      `estimate-check --calibrated` on 06-02's `estimate.tokens`: 104000 against a 100000 budget,
      `over_budget: true`, ratio 1.04, recommendation "split into about 2 slices - a tracer plus 1
      expansion slice". `confidence: low`, `sample_count: 0`, `calibration_applied: false` - the
      figure is not calibrated for this project, so the structural signals matter more: 3 tasks (in
      range) and 17 `files_modified` entries (above the 15 threshold), of which 5 are `skills sync`
      output, 2 are deletions and 2 are fixtures, leaving 7 hand-authored. 06-01 (96000), 06-03
      (72000) and 06-04 (92000) are all inside budget.
    failure_scenario: >-
      Quality degrades across the heaviest prose plan in the phase - the one the ROADMAP scope note
      is about - and the dev workflow ships thinner than the criterion 6 bar.
    fix_hint: >-
      Advisory only; never a revision trigger. If acted on, note that splitting the graduation
      (Task 2) away from the content (Task 1) reopens the window where the author has neither the
      drafts nor the rendered skills, which is the stated reason 06-02 is one plan.

