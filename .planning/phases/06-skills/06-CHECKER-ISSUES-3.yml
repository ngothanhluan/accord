closure_verdicts:
  - prior: "1. warning / verification_derivation / 06-04 Task 3 criterion-6 negative"
    verdict: closed
    note: >-
      (a) No false positive among the four known occurrences, checked against the plan text and
      not the summary. Shape 2 requires an artifact word immediately after the noun, separated by
      at most one space or hyphen (06-04 lines 331-334). "The ticket is the session; no debugging
      artifact is created" (06-02 line 198) is excluded by the semicolon plus four intervening
      words - the closest call of the four, and correctly handled. "otherwise a new session - and
      hand it ./review.md" (06-02 line 213) is followed by a dash and "and". "otherwise a new
      session." (06-04 line 248) is followed by a period and a space, which the filename form
      session + .md does not match. "so the next session finds the argument" (06-04 line 179) is
      followed by "finds", not an artifact word. (b) The double guard-the-guard exists at 06-04
      lines 336-339 and is restated in acceptance criterion line 365: scanned file count > 0 AND
      the matcher asserted to match one fixture string per shape. Over-narrowing fails the fixture
      assertion before the offender array can pass, so the negative cannot be quietly disabled.
      (c) D-109 is preserved unambiguously: lines 322-328 say "This plan fixes the forbidden
      literals; the executor does not choose them", quote the protected sentence, name D-109 and
      the CLAUDE.md runtime-naming prohibition as the reason, and close with "Do not reword those
      sentences to satisfy this scan; the scan is what bends." (d) The two planner-discipline-allow
      markers (lines 359-360) are benign. They suppress exactly one check (gsd-tools
      verify.cjs:410, forbidden literal inside an action block while an acceptance criterion
      negative-greps it), which fires here only because the plan must state the literals in order
      to fix them. verify.plan-structure is valid true with zero warnings on 06-04, so the
      placement between the action and acceptance_criteria elements parses cleanly. The
      artifact-word list (file/artifact/document/doc/note/log/state) is short, load-bearing, and
      works the safe way round for CLAUDE.md simplicity-first: every entry ADDED strengthens the
      assertion, unlike an exemption array where every entry weakens it. Not a hand-maintained
      escape hatch.
  - prior: "2. info / threat_model / 06-01 T-06-03 register cell"
    verdict: closed
    note: >-
      06-01 line 591 now scopes the claim to "a link at the destination file itself" and records
      the parent-directory case in the same cell: .claude/skills/accord-designer/ or
      .claude/skills/ itself, resolved by traversal before the leaf lstat, "known-uncovered and
      accepted", with the dotfiles-symlink reason. The claim no longer exceeds the mitigation and
      the gap sits in the register, which is where a reader of the threat model looks. Accepting
      it as a register note rather than a flagged_assumptions entry is defensible: the acceptance
      is about the scope of one mitigation, not an unresolved question the owner must answer, and
      the residual behaviour (writing through a link the user deliberately created) is the one the
      user asked for. The mitigation itself was verified closed last pass and is not re-opened.
  - prior: "3. info / verification_derivation / 06-02 Task 3 described-as-written"
    verdict: closed
    note: >-
      The predicate is decidable. Action lines 394-398 now read "collect every accord/-rooted path
