# Written by hand in Phase 6. `accord init` does not ship until Phase 7; when it does, it must not
# overwrite this file. It exists so `accord skills sync` can run in this repository, which is what
# lets accord generate its own skill copies instead of hand-maintaining them.
accord: "0.1.0"
profile: maintain
tracker:
  adapter: none
design:
  # This repository ships a CLI and no interface, so no file exists at this path and `accord lint`
  # reports the token rule as skipped. The key is required by config.schema.json.
  tokens: docs/tokens.css
roles: [ba, dev]
runtimes: [claude]
tests:
  # JUnit report under node_modules/.cache so it is never committed.
  report: node_modules/.cache/accord/junit.xml
  affected: npx vitest related --run {files} --reporter=default --reporter=junit --outputFile.junit=node_modules/.cache/accord/junit.xml
  full: npx vitest run --reporter=default --reporter=junit --outputFile.junit=node_modules/.cache/accord/junit.xml
review:
  mode: outcome
stale_days: "14"
# Ticket ids: accord assigns ST-/BUG-/EP-<initials>-<n> to the creator's git user.email (IDS-1).
people:
  "ngothanhluan@hotmail.com": LN
# Ids created before the convention.
legacy_ids: [ASK-1, BASE-1, IDS-1, README-1, REFS-1, SHOW-1, STALE-1, TAGS-1, VID-1]
# Run in order in each new ticket worktree (ST-LN-7 D-07): the build links the workspace bin the hooks call.
setup:
  - npm ci
  - npm run build
  - npm rebuild @accord-dev/accord --ignore-scripts
# ST-LN-8 D-01: task-done and gate done refuse a commit body with a -by: line or a "Generated with" line.
commits:
  trailers: forbid
