name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels the run still going on its previous push; a push to main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    name: build, lint and typecheck
    # Once, not per test cell: lint and typecheck read the source, not the OS or the Node version the tests run on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
  test:
    name: test (${{ matrix.target.os }}, ${{ matrix.node }}, ${{ matrix.target.shard }}/${{ matrix.target.of }})
    # Every test file runs on both operating systems and both Node versions. Windows takes about 25 to 30 minutes
    # for the whole suite on one runner (each test spawns git, and process spawn is slow there), so it is split into
    # 5 shards balanced by measured cost per file (test/shard.ts); every shard must pass. Ubuntu runs it whole in
    # about 3 minutes.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        target:
          - { os: ubuntu-latest, shard: 1, of: 1 }
          - { os: windows-latest, shard: 1, of: 5 }
          - { os: windows-latest, shard: 2, of: 5 }
          - { os: windows-latest, shard: 3, of: 5 }
          - { os: windows-latest, shard: 4, of: 5 }
          - { os: windows-latest, shard: 5, of: 5 }
    runs-on: ${{ matrix.target.os }}
    steps:
      # The sandboxes go to the drive the workspace is on (D:), not the runner's default temp folder on C:; measured
      # about 10% faster over the whole suite. Defender real-time scanning is already off on these runners.
      - name: temp folder beside the workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Two forks on the 4-CPU runners (the default, half the CPUs): four forks finished the light shards faster but
      # doubled the heaviest file (worktree-clean.test.ts, 223 s to 453 s), which sets the length of a shard.
      - run: npm test -- --shard=${{ matrix.target.shard }}/${{ matrix.target.of }}
  examples:
    name: run the generated workflow's commands against the examples
    # No matrix. This job demonstrates that the two commands `accord init` writes into a user's
    # workflow actually work against a filled-in repository; `test` above already covers both
    # operating systems and both Node versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: lint and gate each example through the real CLI
        shell: bash
        run: |
          # Deliberately not -e: both examples are reported on one run, so a failure in the first
          # does not hide the state of the second. Same reasoning as the emitted workflow itself.
          set -uo pipefail
          code=0
          cli="$GITHUB_WORKSPACE/packages/cli/dist/cli.js"
          # Enumerated, never named: a third example is covered without editing this file.
          for example in examples/*/; do
            name=$(basename "$example")
            echo "== $name"
            # A copy, because `repoRoot` resolves the git top-level: running the CLI inside
            # examples/<name>/ of this checkout would read THIS repository's accord/ folder.
            tmp=$(mktemp -d)
            cp -R "$example." "$tmp/"
            git -C "$tmp" init -q
            git -C "$tmp" add -A
            git -C "$tmp" -c user.email=ci@example.invalid -c user.name=ci -c commit.gpgsign=false               commit -q --no-verify -m "$name"
            sha=$(git -C "$tmp" rev-parse --short HEAD)
            # The examples ship the placeholder short sha 1234567, because a file cannot carry the sha
            # of the commit that is about to contain it. Done binds a tick to a commit, so the
            # sandbox's own HEAD goes in before the gate runs. Anchored to the two keys that hold one.
            for file in "$tmp"/accord/tickets/*.md; do
              [ -f "$file" ] || continue
              sed -i "s/^verified_commit: \"1234567\"$/verified_commit: \"$sha\"/" "$file"
            done
            for file in "$tmp"/accord/tickets/*/verification.md; do
              [ -f "$file" ] || continue
              sed -i "s/^commit: 1234567$/commit: $sha/" "$file"
            done
            ( cd "$tmp" && node "$cli" lint ) || code=1
            for file in "$tmp"/accord/tickets/*.md; do
              [ -f "$file" ] || continue
              id=${file#"$tmp"/accord/tickets/}
              id=${id%.md}
              ( cd "$tmp" && node "$cli" gate done "$id" ) || code=1
            done
            rm -rf "$tmp"
          done
          exit $code
  macos:
    name: test (macos-latest, 24, ${{ matrix.shard }}/2) on a release pull request
    # Only on a pull request from a release/ branch, so a release gets macOS evidence without slowing other runs.
    # The runner has 3 CPUs, so the default is one fork: 13 minutes for the suite. Three forks took 9; two shards of
    # three forks keep a release run under 10. test/lock.ts does not lower the fork count on macOS (D-08); 3 forks
    # need about 1.8 GB of the runner's 7 GB.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    env:
      ACCORD_TEST_WORKERS: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --shard=${{ matrix.shard }}/2
  ci-ok:
    name: ci-ok
    # The one check to read or to require: it fails when any job above failed or was cancelled. The macOS job counts
    # only on a release pull request, where it runs; elsewhere it is skipped by its condition.
    if: always()
    needs: [static, test, examples, macos]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or (.key == "macos" and .value.result == "skipped"))' > /dev/null
