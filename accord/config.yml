# Written by hand in Phase 6. `accord init` does not ship until Phase 7; when it does, it must not
# overwrite this file. It exists so `accord skills sync` can run in this repository, which is what
# lets accord generate its own skill copies instead of hand-maintaining them.
accord: "0.3.0"
profile: maintain
tracker:
  adapter: none
design:
  # This repository ships a CLI and no interface, so no file exists at this path and `accord lint`
  # reports the token rule as skipped. The key is required by config.schema.json.
  tokens: docs/tokens.css
roles: [ba, dev]
runtimes: [claude]
tests:
  # JUnit report under node_modules/.cache so it is never committed.
  report: node_modules/.cache/accord/junit.xml
  affected: npx vitest related --run {files} --reporter=default --reporter=junit --outputFile.junit=node_modules/.cache/accord/junit.xml
  full: npx vitest run --reporter=default --reporter=junit --outputFile.junit=node_modules/.cache/accord/junit.xml
review:
  mode: outcome
# ST-LN-47 D-01, D-02: benchmark round 1 raised the auditor; the scout moves to sonnet
# unmeasured, and ST-LN-46 measures it before any default in AGENT_DEFAULTS changes.
# Owner 2026-10-25: the executor runs sonnet at high, since medium left more defects for review to catch.
# Owner 2026-10-25: the critic is back on the AGENT_DEFAULTS value, opus at high, so it has no entry here.
# Owner 2026-10-25: the planner runs opus at high ahead of ST-LN-46's measurement; ST-LN-44's first plan took 5 Must, 14 Should at medium.
models:
  auditor: { model: opus, effort: high }
  executor: { model: sonnet, effort: high }
  planner: { model: opus, effort: high }
  scout: { model: sonnet, effort: low }
stale_days: "14"
# Ticket ids: accord assigns ST-/BUG-/EP-<initials>-<n> to the creator's git user.email (IDS-1).
people:
  "ngothanhluan@hotmail.com": LN
# Ids created before the convention.
legacy_ids: [ASK-1, BASE-1, IDS-1, README-1, REFS-1, SHOW-1, STALE-1, TAGS-1, VID-1]
# Run in order in each new ticket worktree (ST-LN-7 D-07): the build links the workspace bin the hooks call.
setup:
  - npm ci
  - npm run build
  - npm rebuild @accord-dev/accord --ignore-scripts
# ST-LN-8 D-01: task-done and gate done refuse a commit body with a -by: line or a "Generated with" line.
commits:
  trailers: forbid
# ST-LN-62 D-04: paths a lane S ticket may not touch; an entry ending in / covers every path below it.
sensitive:
  interface:
    - packages/cli/src/run.ts
    - packages/core/schemas/
    - packages/core/src/index.ts
    - packages/core/package.json
    - packages/cli/package.json
  data-deletion:
    - packages/cli/src/commands/drop.ts
    - packages/cli/src/commands/worktree.ts
# Copies generated by npm run gen that accord skills sync does not write; gate done never counts them.
generated:
  - packages/core/src/generated/
  - packages/cli/README.md
