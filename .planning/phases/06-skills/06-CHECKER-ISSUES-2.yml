issues:
  - dimension: verification_derivation
    plan: "06-04"
    task: 3
    severity: warning
    required_property: >-
      The criterion-6 negative's forbidden literals are defined narrowly enough that no
      correctly-authored rendered text matches them.
    evidence: >-
      Widening the scan from `accord-ba/SKILL.md` to every `{path,text}` in `skillTargets()`
      (06-04 Task 3, "the criterion-6 negative, run over the WHOLE render output") pulled the dev
      and BA prose into its range, and that prose contains one of the two nouns four times, in
      text the plans themselves instruct the executor to write -
      06-02 Task 1 step 2: "The ticket is the session; no debugging artifact is created";
      06-02 Task 1 step 7: "a subagent where the runtime provides one, otherwise a new session";
      06-04 Task 2: "a subagent where the runtime provides one, otherwise a new session";
      06-04 Task 1: "so the next session finds the argument instead of re-proposing the loser".
      The plan calls the literals "the two resume-artifact nouns" and never defines them. Prior
      finding 4's own evidence shows the pre-revision assertion matched on the bare noun (the BA
      text said "There is no session file and no handoff file" and the criterion asserted the file
      contains neither noun), so the bare-word reading is the one the executor inherits. The other
      noun, handoff, appears nowhere in the intended prose - this is specific to the first one.
    failure_scenario: >-
      The executor builds the scan with the split-literal trick on the bare nouns, runs it over
      the whole render output, and gets four offenders from `accord-dev/SKILL.md`,
      `accord-ba/ready.md` and `accord-ba/setup.md`. The two cheapest repairs are both bad: reword
      "otherwise a new session", which is the runtime-neutral phrasing D-109 requires and the only
      way to say what a fresh context is without naming a runtime product; or loosen the scan
      until it no longer decides criterion 6, which is the finding this warning descends from.
    fix_hint: >-
      One non-binding route: state the literals in the plan as the artifact nouns rather than the
      bare words, so "no session or handoff file" is what is scanned for and "a new session" is
      not a match. Another: keep the bare nouns and match only where a file/artifact word follows.
      Either way the plan, not the executor, should decide it, because the executor's alternative
      is to edit prose the plans specify verbatim.

  - dimension: threat_model
    plan: "06-01"
    task: 1
    severity: info
    required_property: "The T-06-03 register cell describes the coverage the mitigation actually has"
    evidence: >-
      The guard lstats the leaf destination only. A directory junction or symlink at the PARENT
      (`.claude/skills/accord-designer/`) is resolved by path traversal before the leaf lstat
      runs, `mkdirSync(dirname, { recursive: true })` succeeds against it, and `writeFileSync`
      puts bytes inside the link target. The register cell reads "Without this, `writeFileSync`
      follows the link and puts accord's bytes at a path the user never named", which claims more
      than the leaf check delivers.
    failure_scenario: >-
      Weak, and arguably not a defect at all: a user who has symlinked `.claude/skills` or a role
      directory into a dotfiles repository has deliberately arranged that redirection, and
      refusing it would be the annoying behaviour. The cost of the imprecision is only that a
      later reader of the register believes parent-link redirection is covered when it is not.
    fix_hint: >-
      One non-binding route: scope the claim in the cell to the destination file itself. No test
      or code change is implied.

  - dimension: verification_derivation
    plan: "06-02"
    task: 3
    severity: info
    required_property: >-
      A set-membership predicate an assertion turns on is defined mechanically enough that two
      executors build the same set.
    evidence: >-
      The criterion (line 417) and the action (lines 394-398) both say "the set of `accord/`-rooted
      paths DESCRIBED AS WRITTEN", but every other scan in this phase is specified down to its
      mechanism (split-literal, case-insensitivity, sort order, offender-array shape,
      guard-the-guard). "Described as written" needs either a write-verb heuristic - which the
      planner deliberately and correctly avoided - or a collapse to "named at all". The collapse
      is sound for the text 06-02 Task 1 specifies, because the `accord/`-rooted restriction
      already excludes the template source path and the relative `./code-review.md`, leaving
      exactly one member. It is brittle only forward: a future brief naming an `accord/`-rooted
      path it merely READS turns a correct brief red.
    failure_scenario: >-
      Not reachable from this phase's content. Recorded so the executor collapses the predicate
      knowingly rather than inventing a verb heuristic that trips on "A reviewer that fixes".
    fix_hint: >-
      One non-binding route: say in the action that the set is every `accord/`-rooted path the two
      texts name, and that the restriction to `accord/`-rooted is what makes "named" and "written"
      the same set here.

  - dimension: verification_derivation
    plans: ["06-04"]
    task: null
    severity: info
    required_property: "A stated artifact count matches the render output it counts"
    evidence: >-
      The full-roster render output is 11 files - `accord-ba/` 4, `accord-dev/` 5,
      `accord-designer/` 2 - i.e. three `SKILL.md` and eight bundled references. Two places say
      otherwise: 06-04 `must_haves` line 40 ("three `SKILL.md` files and nine bundled references")
      and 06-VALIDATION.md's new Manual-Only row ("read all twelve rendered files"). Both then
      enumerate correctly, and no assertion anywhere pins the number - 06-04's acceptance
      criterion line 350 counts this repository's nine synced paths under a `[ba, dev]` roster,
      which is right.
    failure_scenario: >-
      None mechanical. A reader counting the enumeration against the prose pauses; the manual
      reviewer reads the enumerated list, which is correct.
    fix_hint: "One non-binding route: eleven and eight."
