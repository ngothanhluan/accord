name: publish
# D-149: a pushed tag and nothing else, and no path filter — a job that skips itself leaves a
# required status check pending forever, the same trap D-138 already names for the emitted accord.yml.
#
# The FILENAME is part of the npm trusted-publisher record (owner + repo + workflow filename, matched
# exactly). Renaming this file breaks authentication on a workflow whose diff shows no change, so it
# is fixed at creation and never renamed.
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    # Declared per job, unlike ci.yml which declares `contents: read` at workflow level: `id-token:
    # write` is what mints the OIDC token, and a job that inherits it holds the authority to write a
    # package every user installs. The smoke job below has no use for it and therefore never sees it.
    # No GitHub deployment environment is declared: it is optional per npm's documentation, and one
    # whose branch protections do not allow the tag ref blocks this job with an error that reads
    # nothing like its cause.
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.19.0, over the npm 11.5.1 / Node 22.14 floor trusted publishing
          # requires — which is why this job carries no global npm upgrade step. Moving it back to
          # Node 22 (npm 10.9.8) puts that step back below the floor and makes it mandatory again.
          node-version: 24
          # Load-bearing, not cosmetic: this writes a project-level .npmrc naming the registry, and
          # that registry is what the OIDC exchange targets. There is no `always-auth` input on this
          # action; do not copy one from an older recipe.
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: the tag and the manifest name the same version, exactly
        id: version
        shell: bash
        env:
          # Bound through env:, never interpolated into the script body — the tag is a
          # maintainer-controlled string flowing into a shell on a runner that holds publish rights (T-09-10).
          TAG: ${{ github.ref_name }}
        run: |
          # Fail fast, and before `npm ci`: a wrong tag should cost a few seconds, not a build.
          set -euo pipefail
          # `node -p` evaluates in CJS scope, which is why `require` works in a "type": "module"
          # repository. A JSON parser rather than a regex over JSON — the classic silently-wrong step.
          manifest=$(node -p "require('./packages/cli/package.json').version")
          want="${TAG#v}"
          # D-94's rule, in shell: byte equality on two strings, with the `v` strip as the only
          # transformation. No semver library, no range, no tolerance — a tag that publishes a
          # different version than it names is the one mismatch the pin cannot recover from afterwards.
          if [ "$want" != "$manifest" ]; then
            echo "tag ${TAG} names ${want}, packages/cli/package.json names ${manifest}" >&2
            exit 1
          fi
          echo "VERSION=${manifest}" >> "$GITHUB_ENV"
          # Both files, not one: GITHUB_ENV does not cross a job boundary, so the smoke job reads
          # this half through needs.publish.outputs.version.
          echo "VERSION=${manifest}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # One run on one OS (D-152), not ci.yml's 2 OS x 2 Node matrix: that matrix already runs on
      # every push to main, and the one hole it cannot cover is a tag pointing at a commit that never
      # went through CI — which this single check closes. `check` is build && lint && typecheck && test,
      # and its build sequences core before cli, which the bundling depends on.
      - run: npm run check
      - name: publish unless this version is already on the registry
        shell: bash
        env:
          PKG: '@accord-dev/accord'
        run: |
          set -euo pipefail
          # `|| true` is load-bearing: on the first publish the package does not exist at all, so
          # `npm view` exits non-zero with E404 and `set -e` would fail the very release this guard
          # protects. The emptiness of stdout is the signal, not the exit code. A pre-flight probe
          # rather than matching npm's error text, so a transient E409 packument write collision
          # cannot be mistaken for "already published" and silently skipped (T-09-14).
          on_registry=$(npm view "${PKG}@${VERSION}" version 2>/dev/null || true)
          if [ "$on_registry" = "$VERSION" ]; then
            echo "${PKG}@${VERSION} is already on the registry - skipping publish"
            exit 0
          fi
          # `--access public` explicitly: a no-op under npm 11's default, correct under the historical
          # restricted default for scoped packages, and self-documenting at the one call site that
          # matters. The provenance flag is deliberately not passed — trusted publishing generates and
          # publishes the attestation automatically, and passing it changes the failure mode on a
          # non-OIDC path.
          npm publish --workspace packages/cli --access public

  smoke:
    needs: publish
    # No `permissions` key at all, so this job cannot mint an OIDC token even by accident (T-09-11).
    # This job is still the only proof of the clean-machine clause, so a visible package that does
    # not install or run fails at once, and evidence that can be ignored is not evidence. One
    # outcome is soft on purpose (Phase 08.9.1 D-07, BUG-LN-26): a version that never became
    # visible within the wait passes with a warning and a step-summary line, because the publish
    # job already passed and the registry's cache, not the package, is the cause. When the last
    # attempt could not reach the registry, the warning and the summary line say so and name the
    # network code, and npx's last output is printed, so a registry outage that lasted the whole
    # wait reads as one in the log and the summary.
    runs-on: ubuntu-latest
    # Above the wait budget (SMOKE_BUDGET, 900 s) plus one capped call (120 s) and one pause (15 s),
    # about 17 minutes: the loop is bounded by time, so a slow registry ends the step soft before this
    # limit cancels the job.
    timeout-minutes: 25
    steps:
      # Deliberately no actions/checkout: `npx` on a runner with no package.json and no node_modules
      # is the closest thing Actions offers to a clean machine, which is what the criterion asks for.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install the published version through npx on a clean runner
        id: smoke
        shell: bash
        env:
          PKG: '@accord-dev/accord'
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # `-u` and `-o pipefail` but deliberately NOT `-e`, unlike the publish job above: the loop
          # classifies a non-zero exit, and `-e` would stop on the first attempt. GitHub starts this
          # shell as `bash -e -o pipefail`, so `set +e` is what turns `-e` off: without it the first
          # `out=$(npx ...)` that fails (the version not visible yet) ends the step silently with
          # exit 1, which is how the 0.21.1 smoke step failed.
          set +e
          set -uo pipefail
          # An empty version would make npx install the latest release and call it proof.
          if [ -z "${VERSION:-}" ]; then
            echo "VERSION is empty: the publish job gave this job no version to install" >&2
            exit 1
          fi
          # The registry is eventually consistent, and the cause is measured (BUG-LN-26): npx resolves
          # name@version from the packument, which the registry's CDN caches for 5 minutes, and the
          # registry stamps a new version 1.3 to 6.2 minutes after `npm publish` returns, so a version
          # can stay invisible for about 11.5 minutes. 60 attempts at 15s is about 15 minutes. A
          # cache-bypass flag does not help: the edge ignores it.
          # The sleeps are not the whole cost: a call that cannot reach the registry spends minutes
          # inside npm's own retries. So the loop also stops at a time budget, and each call gets its
          # own cap, whose hit counts as the network class (WR-01).
          attempts="${SMOKE_ATTEMPTS:-60}"
          interval="${SMOKE_INTERVAL:-15}"
          budget="${SMOKE_BUDGET:-900}"
          call_cap="${SMOKE_CALL_TIMEOUT:-120}"
          # A zero or non-number would run no attempt and end soft: a green step with no proof.
          need_count() {
            case "$2" in
              ''|*[!0-9]*|0) echo "bad $1: '$2' (a whole number above 0)" >&2; exit 1 ;;
            esac
          }
          need_count SMOKE_ATTEMPTS "$attempts"
          need_count SMOKE_BUDGET "$budget"
          need_count SMOKE_CALL_TIMEOUT "$call_cap"
          case "$interval" in
            ''|*[!0-9]*) echo "bad SMOKE_INTERVAL: '${interval}' (a whole number of seconds, 0 or more)" >&2; exit 1 ;;
          esac
          deadline=$((SECONDS + budget))
          tried=0
          # The registry's URL form of the package name, for the E404 that names this package.
          encoded="${PKG/\//%2f}"
          # What the last retried attempt was, kept for the soft end after the loop: its class
          # (not-visible or network), its whole output, and for network its npm error code.
          last=''
          last_out=''
          last_code=''
          for attempt in $(seq 1 "$attempts"); do
            # The budget is checked before a call, never before the first one.
            if [ "$attempt" -gt 1 ] && [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            tried="$attempt"
            out=$(timeout "$call_cap" npx --yes "${PKG}@${VERSION}" --version 2>&1); code=$?
            if [ "$code" -eq 124 ]; then
              out=$'npm error code ETIMEDOUT\nnpm error npx did not answer within '"${call_cap}"' s'
              code=1
            fi
            if [ "$code" -eq 0 ]; then
              echo "attempt ${attempt}: ${out}"
              # Visible but wrong output is not a propagation problem. Failing now rather than
              # retrying keeps a genuinely broken bundle from burning the budget and being reported
              # as a slow registry.
              [ "$(echo "$out" | tail -1 | tr -d '[:space:]')" = "${VERSION}" ] && exit 0
              echo "resolved, but printed '${out}' not '${VERSION}'" >&2
              exit 1
            fi
            # Not visible yet: fixed-string matches bound to this package and version. A missing
            # dependency raises ETARGET too, and another package's E404 names another URL (the
            # trailing space keeps a longer package name from matching); neither is this release.
            # Here-strings, not `echo | grep -q`: under pipefail a pipe to a grep that stops at its
            # first match can exit 141 on a large output and hide a real not-visible failure (IN-05).
            if grep -Fq "No matching version found for ${PKG}@${VERSION}" <<<"$out" \
              || { grep -Fq 'npm error code E404' <<<"$out" \
                && grep -Fq "GET https://registry.npmjs.org/${encoded} " <<<"$out"; } \
              || grep -Fq "'${PKG}@${VERSION}' is not in this registry" <<<"$out"; then
              # The line that says why (the notarget or 404 line), else the error code line.
              why=$(echo "$out" | grep -E 'notarget|npm error 404' | head -1)
              [ -n "$why" ] || why=$(echo "$out" | grep 'npm error code' | head -1)
              echo "attempt ${attempt}: not visible yet: ${why}"
              last='not-visible'
              last_out="$out"
              last_code=''
              sleep "$interval"
              continue
            fi
            # Transient network failure: retried the same way, but remembered as a network
            # failure so the soft end below never words it as a plain not-visible result.
            net=$(echo "$out" | grep -oE 'npm error code (ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND)' | head -1)
            if [ -n "$net" ]; then
              echo "attempt ${attempt}: network error: ${net}"
              last='network'
              last_out="$out"
              last_code="${net##* }"
              sleep "$interval"
              continue
            fi
            # Anything else is not about visibility: a broken bundle, an integrity error, a
            # missing dependency. Fail at once with everything npx said, whatever came before.
            echo "attempt ${attempt}: npx failed for a reason that is not visibility:" >&2
            echo "$out" >&2
            exit 1
          done
          # Only a version that never showed reaches this line (a visible attempt always ended the
          # loop above), so the step ends soft (D-07), and the last attempt decides the wording.
          if [ "$last" = 'network' ]; then
            echo "::warning title=not visible yet::${PKG}@${VERSION} was published but was not visible after ${tried} attempts; the last attempt could not reach the registry (network error ${last_code})"
            echo "npx output of the last attempt:"
            echo "$last_out"
            echo "${PKG}@${VERSION}: publish passed, version not visible yet after ${tried} attempts; the last attempt could not reach the registry (network error ${last_code}); this is not a failed release" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::warning title=not visible yet::${PKG}@${VERSION} was published but was not visible after ${tried} attempts"
            echo "${PKG}@${VERSION}: publish passed, version not visible yet after ${tried} attempts; this is not a failed release" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          exit 0
